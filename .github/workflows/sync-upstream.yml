name: Sync Upstream

on:
  schedule:
    # 每周日 00:00 UTC 执行（对应北京时间每周日 08:00）
    - cron: '0 0 * * 0'
  workflow_dispatch:   # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 Action 向你的仓库推送提交
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master   # 确保这是你的主分支名（main 或 master）
          token: ${{ secrets.GITHUB_TOKEN }} # 显式传入 token
          persist-credentials: true          # 🔴 关键修改：改为 true，保留凭据
          fetch-depth: 0                     # 建议加上，拉取完整历史以便同步

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.2
        with:
          target_sync_branch: master
          upstream_sync_branch: master
          upstream_sync_repo: Devilstore/Glados-Railgun-checkin
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report status
        run: |
          if [ "${{ steps.sync.outputs.has_new_commits }}" == "true" ]; then
            echo "✅ 发现上游新提交，已同步。"
          else
            echo "ℹ️ 上游无新提交，无需同步。"
          fi
