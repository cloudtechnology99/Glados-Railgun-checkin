name: Sync Upstream

on:
  schedule:
    # 每周日 UTC 0 点（北京时间周日 8 点），即每 7 天一次
    - cron: '0 0 * * 0'
  # 支持手动触发，上游有紧急更新时用
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 推送/合并代码必需
      pull-requests: write     # 分叉时可能通过 PR 合并

    steps:
      - name: Sync fork
        uses: tgymnich/fork-sync@v2.0.9
        with:
          owner: Devilstore
          repo: Glados-Railgun-checkin
          base: master         # 同步到你的哪个分支
          head: master         # 从上游的哪个分支拉
          token: ${{ secrets.GITHUB_TOKEN }}
